name: Build Google Play (AAB signé)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o RaedDelivery.zip
      - run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/upload.jks"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.13 }
      - run: yes | sdkmanager --licenses || true
      - run: gradle bundleRelease assembleRelease
        working-directory: RaedDelivery
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/upload.jks
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: RaedDelivery-GooglePlay
          path: |
            RaedDelivery/app/build/outputs/bundle/release/app-release.aab
            RaedDelivery/app/build/outputs/apk/release/app-release.apk
