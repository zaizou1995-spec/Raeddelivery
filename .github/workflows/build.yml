name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o RaedDelivery.zip
      - run: echo "dependencies { implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22') }" >> RaedDelivery/app/build.gradle
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: yes | sdkmanager --licenses || true
      - run: gradle assembleDebug
        working-directory: RaedDelivery
      - uses: actions/upload-artifact@v4
        with:
          name: RaedDelivery-apk
          path: RaedDelivery/app/build/outputs/apk/debug/app-debug.apk
